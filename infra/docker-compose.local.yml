# Postgres cho máy dev. Prod dùng RDS, không dùng file này.
services:
  db:
    image: postgres:18-alpine
    container_name: rb-pg
    environment:
      POSTGRES_USER: riverbank
      POSTGRES_PASSWORD: riverbank
      POSTGRES_DB: riverbank
    ports:
      - "5432:5432"
    volumes:
      - rb-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverbank"]
      interval: 5s
      retries: 10

volumes:
  rb-pg-data:
