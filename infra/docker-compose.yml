x-logging: &cw-logging
  driver: awslogs
  options:
    awslogs-region: ap-southeast-1
    awslogs-group: /riverbank/app
    awslogs-create-group: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    env_file:
      - .env.local
    depends_on:
      - api
      - pgweb
    logging: *cw-logging

  api:
    image: ghcr.io/qismeeee/riverbank-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      RIVERBANK_ENV: prod
      AWS_REGION: ap-southeast-1
      DB_HOST: riverbank-db.cdcgq4mmivnf.ap-southeast-1.rds.amazonaws.com
      DB_SECRET_ID: "rds!db-1893a3d4-b65e-47a7-bb55-2134b3deaff7"
      S3_BUCKET: riverbank-data-424016506356
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://ezxriverbank.vercel.app}
      RIVERBANK_WORKFLOW_MODE: enabled
      RIVERBANK_WORKFLOW_IDENTITY: token
      RIVERBANK_WORKFLOW_STORAGE: postgres
      RIVERBANK_WORKFLOW_FEATURES: seller_book
      RIVERBANK_WORKFLOW_RISK: lightgbm
      RIVERBANK_WORKFLOW_CIC_GATE: jev
      RIVERBANK_STATEMENT_OCR: llm
      STATEMENT_OCR_PROVIDER: openrouter
      STATEMENT_OCR_MODEL: google/gemini-3.1-flash-lite
      RIVERBANK_DOCUMENT_STORE: local
      RIVERBANK_DOCUMENT_DIR: /var/lib/riverbank/statements
    volumes:
      - statement_files:/var/lib/riverbank/statements
    deploy:
      resources:
        limits:
          memory: 1200m
    logging: *cw-logging

  pgweb:
    image: sosedoff/pgweb:0.16.2
    restart: unless-stopped
    command: ["--bind=0.0.0.0", "--listen=8081", "--prefix=db"]
    env_file:
      - .env.local
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *cw-logging

volumes:
  caddy_data:
  caddy_config:
  statement_files:
