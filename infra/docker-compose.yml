x-logging: &cw-logging
  driver: awslogs
  options:
    awslogs-region: ap-southeast-1
    awslogs-group: /riverbank/app
    awslogs-create-group: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    env_file:
      - .env.local
    depends_on:
      - api
      - pgweb
    logging: *cw-logging

  api:
    image: ghcr.io/qismeeee/riverbank-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      RIVERBANK_ENV: prod
      AWS_REGION: ap-southeast-1
      DB_HOST: riverbank-db.cdcgq4mmivnf.ap-southeast-1.rds.amazonaws.com
      DB_SECRET_ID: "rds!db-1893a3d4-b65e-47a7-bb55-2134b3deaff7"
      S3_BUCKET: riverbank-data-424016506356
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://ezxriverbank.vercel.app}
      RIVERBANK_WORKFLOW_MODE: enabled
      RIVERBANK_WORKFLOW_IDENTITY: token
      RIVERBANK_WORKFLOW_STORAGE: postgres
      RIVERBANK_WORKFLOW_FEATURES: seller_book
      RIVERBANK_WORKFLOW_RISK: lightgbm
      RIVERBANK_WORKFLOW_CIC_GATE: jev
      RIVERBANK_STATEMENT_OCR: llm
      STATEMENT_OCR_PROVIDER: openrouter
      STATEMENT_OCR_MODEL: google/gemini-3.1-flash-lite
      RIVERBANK_DOCUMENT_STORE: local
      RIVERBANK_DOCUMENT_DIR: /var/lib/riverbank/statements
      RIVERBANK_MESSAGE_BUS: ${RIVERBANK_MESSAGE_BUS:-memory}
      RIVERBANK_EVENT_RELAY: ${RIVERBANK_EVENT_RELAY:-off}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RIVERBANK_KV_STORE: ${RIVERBANK_KV_STORE:-memory}
      RIVERBANK_MODEL_GATE_STORE: ${RIVERBANK_KV_STORE:-memory}
      VALKEY_HOST: valkey
    volumes:
      - statement_files:/var/lib/riverbank/statements
    deploy:
      resources:
        limits:
          memory: 1200m
    logging: *cw-logging

  pgweb:
    image: sosedoff/pgweb:0.16.2
    restart: unless-stopped
    command: ["--bind=0.0.0.0", "--listen=8081", "--prefix=db"]
    env_file:
      - .env.local
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *cw-logging

  kafka:
    image: apache/kafka:3.9.1
    profiles: ["events"]
    restart: unless-stopped
    expose:
      - "9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 336
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640m
    logging: *cw-logging

  kafka-topics:
    image: apache/kafka:3.9.1
    profiles: ["events"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${RIVERBANK_CASE_EVENTS_TOPIC:-riverbank.case-events}
      - --partitions
      - "6"
      - --replication-factor
      - "1"
    logging: *cw-logging

  kafka-console:
    image: redpandadata/console:v3.12.0
    profiles: ["events"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      SERVER_BASEPATH: /kafka
    expose:
      - "8080"
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160m
    logging: *cw-logging

  valkey:
    image: valkey/valkey:8.1-alpine
    profiles: ["events"]
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - volatile-ttl
      - --protected-mode
      - "no"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96m
    logging: *cw-logging

volumes:
  kafka_data:
  caddy_data:
  caddy_config:
  statement_files:
