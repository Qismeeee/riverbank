name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/qismeeee/riverbank-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          RIVERBANK_ENV: local

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: copy infra
        run: scp -i ~/.ssh/deploy -r infra/. ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/riverbank/
      - name: compose up
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
          set -eu
          cd /opt/riverbank
          cp .env.prod .env && touch .env.local
          echo "IMAGE_TAG=${{ needs.build.outputs.tag }}" >> .env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          REMOTE
      - name: provision demo access
        env:
          DEMO_AUTH_JSON: ${{ secrets.WORKFLOW_DEMO_AUTH_JSON }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DEMO_AUTH_JSON" ]; then
            echo "WORKFLOW_DEMO_AUTH_JSON must contain the demo credential hash manifest."
            exit 1
          fi
          printf '%s' "$DEMO_AUTH_JSON" | ssh -i ~/.ssh/deploy "$EC2_USER@$EC2_HOST" \
            'cd /opt/riverbank && docker compose exec -T api python -m scripts.demo_auth provision'
      - name: smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://13-214-87-165.sslip.io/health || true)
            [ "$code" = "200" ] && echo "health 200 after ${i}x5s" && exit 0
            sleep 5
          done
          echo "health check failed" && exit 1
