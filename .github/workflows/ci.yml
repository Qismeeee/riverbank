name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - name: test
        env:
          RIVERBANK_ENV: local
        run: make test PYTHON=python

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: make eval-gate PYTHON=python

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: riverbank
          POSTGRES_DB: riverbank_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U riverbank -d riverbank_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVERBANK_ENV: local
      WORKFLOW_TEST_DATABASE_URL: postgresql://riverbank@127.0.0.1:5432/riverbank_test
      DATABASE_URL: postgresql://riverbank@127.0.0.1:5432/riverbank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: make test-postgres PYTHON=python
