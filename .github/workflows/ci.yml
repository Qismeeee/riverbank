name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: riverbank
          POSTGRES_PASSWORD: riverbank
          POSTGRES_DB: riverbank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riverbank -d riverbank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check . ../eval ../data/synth && ruff format --check . ../eval ../data/synth
      - name: test
        env:
          RIVERBANK_ENV: local
          WORKFLOW_TEST_DATABASE_URL: postgresql://riverbank:riverbank@127.0.0.1:5432/riverbank_test
        run: pytest -q
